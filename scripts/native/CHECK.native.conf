# CHECK.native.conf: checkd.py configuration for the native track (form B; native/infra/PROOF_OBJECT.md §3.2b, RUNPLAN.md §4).
# Use with CK_CONF=<this file>.  Batch mode (queue agent, QUEUE.md 02:55 UTC): checkd packs items up to BATCHMB into one CHECKER call;
# the CHECKER (nchk_ii.sh -> nchk_batch.sh) builds ONE chunk module per batch and prints "ITEM id OK|FAIL ndecl= thm= chunk= olean="
# per item; checkd uploads each olean and its <chunk>.keys sidecar to OLEANDEST before recording (keys=URL).  Item keys come from
# checkd's ITEMBIN.key (r3qglue --itemkey: root/ext/rng) + the R3XI header (py/itemkey.py, which cross-checks the root line).
# Items are capped by --xqcap 12000 --xqcapd 15 --xqcapb 300 (fleet default: <= 12k nodes and <= 300 MB; H4's largest 122 MB);
# a 0.25-0.3 GB batch peaks at 1.6-2.8 GB RSS (measured 2026-10-07: 2.8 GB on 232 MB of real items), hence MEMGB 3; raised to 4 for single items up to ~0.5 GB (the queue cap overshoots to 320 MB).
# Library (audit T-1, 2026-10-07): the content-addressed build lib/out/ckr-e07b8136b3c8 (lib/CKR_FP; MANIFEST.sha256 636aab848c0a8873,
# libnative.so sha256 f12864310c3ce770); nchk_batch.sh verifies it per chunk (before and after the compile) and records lib= fp= so=
# dyn= in every ITEM line and .keys line; glue.py admits only allow-listed fp/so and pinned chunk oleans.
# CHECKER: nchk_auto.sh splits a batch by case (pool -> ii | i | i13 via casemap.txt; checkd batches across pools); nchk_ii.sh for
# case-II-only VMs.
CHECKER r22/lean/native/infra/lib/nchk_auto.sh
MODULES r22/lean/native/infra/lib/out
BATCHMB 250
BATCHMAX 2000
BATCHPAR 1
MEMGB 4
TIMEOUT 3600
# OLEANDEST: the production chunk store (checkd uploads <chunk>.olean and <chunk>.keys to OLEANDEST/<host>/; the VMs need the
# storage-rw scope, fleet.conf SCOPES).  Run 1 (case II, library ckr-e07b8136b3c8; coordinator 2026-10-07): store_run1 (glue reads it back with GLUE_LIBALLOW).
OLEANDEST gs://tstomar-mm3-xfer/r3q/native/store_run1
